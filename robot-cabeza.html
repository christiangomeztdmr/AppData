<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asistente Virtual</title>
<style>
  /* ===================================================================
     CABEZA DEL ASISTENTE
     La cabeza permanece quieta. Solo se mueven los ojos (mirada y parpadeo).
     Fondo transparente. Para usarla en MAGPROJECT copia:
       1) las reglas CSS  .mag-head ... @keyframes gaze
       2) el bloque  <span class="mag-head"> ... </span>  (va DENTRO de tu botón, sin fondo)
       3) el script del final
     =================================================================== */
  .mag-head {
    position: relative;
    display: block;
    width: 100%;                      /* ocupa el ancho de su contenedor */
    aspect-ratio: 755 / 523;
    isolation: isolate;
    pointer-events: none;
    user-select: none;
  }
  .mag-head img { position: absolute; display: block; -webkit-user-drag: none; }
  .mag-head > img { left: 0; top: 0; width: 100%; height: 100%; }

  /* Ojos: capa luminosa sobre la pantalla; miran a los lados (12 s) */
  .mag-gaze {
    position: absolute;
    left: 17.4834%; top: 47.9924%; width: 65.1656%; height: 29.8279%;
    mix-blend-mode: screen;
    animation: mag-gaze 12s ease-in-out infinite;
  }
  .mag-gaze img { left: 0; top: 0; width: 100%; height: 100%; transform-origin: 50% 75.6%; }

  @keyframes mag-gaze {
    0%, 50%, 68%, 100% { transform: translate(0, 0); }
    7%, 22%            { transform: translate(-5%, 0); }
    30%, 42%           { transform: translate(3.6%, -8%); }
    74%, 80%           { transform: translate(5.6%, 5.6%); }
  }
  @media (prefers-reduced-motion: reduce) { .mag-gaze { animation: none; } }

  /* ===================================================================
     SOLO PARA ESTA VISTA PREVIA (no hace falta copiarlo)
     =================================================================== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: linear-gradient(135deg, #cfe0f6, #e6edf7 55%, #d9e4f3); font-family: "Segoe UI", system-ui, sans-serif; color: #1a2540; }
  .demo { min-height: 100%; display: grid; place-items: center; gap: 24px; padding: 24px 16px 120px; text-align: center; align-content: center; }
  .demo .big { width: min(86vw, 380px); }
  .demo p { font-size: 13px; color: #5a6a8c; }

  /* Botón de la esquina: solo la cabeza, sin círculo ni fondo */
  .mag-fab {
    --mag-size: 68px;                 /* ancho de la cabeza */
    position: fixed; right: 24px; bottom: 24px;
    width: var(--mag-size); padding: 0; border: 0; background: none;
    cursor: pointer; line-height: 0;
    filter: drop-shadow(0 4px 7px rgba(22, 50, 120, .28));   /* sombra suave: separa la cabeza blanca del fondo */
    transition: transform .15s ease, filter .15s ease;
  }
  .mag-fab:hover { transform: translateY(-2px); filter: drop-shadow(0 7px 10px rgba(22, 50, 120, .34)); }
  .mag-fab:focus-visible { outline: 3px solid #1f6cf2; outline-offset: 4px; border-radius: 12px; }
  .mag-fab .mag-head { width: 100%; }
</style>

<script>
(function () {
  /* Parpadeo a intervalos irregulares: normal, doble ocasional y alguno lento.
     Sirve para todas las cabezas de la página.                                */
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  var eyes = document.querySelectorAll('.mag-eyes');
  if (!eyes.length || !eyes[0].animate) return;

  function blink(ms, depth) {
    for (var i = 0; i < eyes.length; i++) {
      eyes[i].animate(
        [{ transform: 'scaleY(1)' }, { transform: 'scaleY(' + depth + ')', offset: 0.45 }, { transform: 'scaleY(1)' }],
        { duration: ms, easing: 'ease-in-out' }
      );
    }
  }
  function next() {
    setTimeout(function () {
      if (!document.hidden && !reduce.matches) {
        var r = Math.random();
        if (r < 0.12)      blink(340, 0.05);                                                            // lento
        else if (r < 0.30) { blink(180, 0.07); setTimeout(function () { blink(180, 0.07); }, 290); }   // doble
        else               blink(190 + Math.random() * 30, 0.07);
      }
      next();
    }, 2000 + Math.random() * 3600);
  }
  setTimeout(next, 1200);
})();
</script>
