<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot Completo</title>
<style>
  :root { --bg: #ffffff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); }
  body { display: grid; place-items: center; padding: 16px; }
  .robot { width: min(100%, 640px); height: auto; display: block; overflow: visible; }

  /* Animaciones suaves */
  .head  { animation: bob 3.6s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .eyes  { animation: pulse 3.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .82; } }
  .eye   { transform-box: fill-box; transform-origin: center; animation: blink 6s infinite; }
  @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.15); } }
  .glow  { animation: glow 3.2s ease-in-out infinite; }
  @keyframes glow { 0%,100% { opacity: 1; } 50% { opacity: .65; } }
  @media (prefers-reduced-motion: reduce) { .head, .eyes, .eye, .glow { animation: none; } }
</style>
</head>
<body>

    <filter id="glowSm" x="-40%" y="-200%" width="180%" height="500%">

    <filter id="innerBl" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">

      <feOffset in="b" dx="-3" dy="-5" result="bo"/>

      <feOffset in="b" dx="4" dy="5" result="bo2"/>

      <feFlood flood-color="#9fd0ff" flood-opacity=".7" result="fc2"/>
      <feComposite in="fc2" in2="edge2" operator="in" result="lite"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/><feMergeNode in="lite"/></feMerge>
    </filter>
