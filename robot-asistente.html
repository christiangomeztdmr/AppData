<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asistente Virtual</title>
<style>
  :root {
    --page-bg: transparent;          /* sin fondo: se ve lo que haya detrás */
    --assistant-size: 560px;   /* ancho máximo del asistente */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: grid;
    place-items: center;
    padding: 16px;
    background: var(--page-bg);
  }

  /* ---------- Asistente ----------
     Para integrarlo en otra página, copia el bloque .assistant (HTML),
     estas reglas CSS y el script del final.
     Fondo transparente. Movimiento de una persona de pie: las piernas, los
     pies y el suelo quedan fijos; el torso se inclina desde la cadera, respira, y la
     cabeza y los ojos se mueven. No mueve brazos ni piernas por su cuenta.
     El lienzo mide 1024 x 1536 px y se escala al ancho disponible.        */
  .assistant {
    --k: 0.5;
    position: relative;
    width: min(100%, var(--assistant-size));
    aspect-ratio: 1024 / 1536;
    user-select: none;
  }
  .stage { position: absolute; left: 0; top: 0; width: 1024px; height: 1536px; zoom: var(--k); pointer-events: none; }
  @supports not (zoom: 1) { .stage { zoom: normal; transform: scale(var(--k)); transform-origin: 0 0; } }
  .stage img { position: absolute; display: block; -webkit-user-drag: none; }

  .figure { isolation: isolate; }
  .layer  { position: absolute; inset: 0; }

  /* Sombra de suelo propia (fija): el robot no trae fondo ni sombra en la imagen */
  .floor {
    position: absolute; left: 140px; top: 1368px; width: 744px; height: 76px;
    background: radial-gradient(closest-side, rgba(20, 40, 100, .30), rgba(20, 40, 100, .14) 55%, rgba(20, 40, 100, 0));
  }

  .shape { position: absolute; left: 0; top: 540px; width: 1024px; height: 996px;
           background: var(--body) 0 0 / 100% 100% no-repeat; }
  .lower { clip-path: inset(39.3574% 0 0 0); }     /* piernas y suelo: fijos */
  .upper { clip-path: inset(0 0 60.3414% 0); }     /* torso */

  /* Torso: se inclina desde la cadera (ritmo 7,3 s) y respira (3,8 s).
     La inclinación es lateral y no mueve la cadera: la unión con las piernas no se desplaza. */
  .lean   { transform-origin: 512px 935px; animation: lean   7.3s ease-in-out infinite; }
  .breath { transform-origin: 512px 935px; animation: breath 3.8s ease-in-out infinite; }

  /* Cabeza: gira desde el cuello y asiente (15 s y 19 s) */
  .nod { animation: nod 19s ease-in-out infinite; }
  .head {
    position: absolute; left: 90px; top: 0; width: 844px; height: 566px;
    isolation: isolate; transform-origin: 422px 562px; animation: tilt 15s ease-in-out infinite;
  }
  .head > img { left: 0; top: 0; width: 100%; height: 100%; }

  /* Ojos: capa luminosa sobre la pantalla; miran a los lados (12 s) */
  .gaze {
    position: absolute; left: 176px; top: 286px; width: 492px; height: 156px;
    mix-blend-mode: screen; animation: gaze 12s ease-in-out infinite;
  }
  .gaze img { left: 0; top: 0; width: 100%; height: 100%; transform-origin: 50% 75.6%; }

  @keyframes lean {
    0%, 100% { transform: skewX(0deg); }
    16%, 36%  { transform: skewX(-3.4deg); }
    54%, 74%  { transform: skewX(2.8deg); }
  }
  @keyframes breath {
    0%, 100% { transform: scale(1, 1); }
    45%       { transform: scale(1.007, 1.022); }
  }
  @keyframes tilt {
    0%, 60%, 74%, 100% { transform: rotate(0deg); }
    9%, 26%              { transform: rotate(-4.5deg); }
    36%, 50%             { transform: rotate(2.8deg); }
    80%, 92%             { transform: rotate(-1.8deg); }
  }
  @keyframes nod {
    0%, 18%, 27%, 56%, 66%, 75%, 100% { transform: translateY(0); }
    22%                                     { transform: translateY(8px); }
    60%                                     { transform: translateY(12px); }
    70%                                     { transform: translateY(6px); }
  }
  @keyframes gaze {
    0%, 50%, 68%, 100% { transform: translate(0, 0); }
    7%, 22%              { transform: translate(-5%, 0); }
    30%, 42%             { transform: translate(3.6%, -8%); }
    74%, 80%             { transform: translate(5.6%, 5.6%); }
  }

  @media (prefers-reduced-motion: reduce) { .lean, .breath, .nod, .head, .gaze { animation: none; } }
</style>
</head>

<script>
(function () {
  var root   = document.getElementById('assistant');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  /* escala: el lienzo de 1024 px se ajusta al ancho disponible */
  function fit() { root.style.setProperty('--k', root.clientWidth / 1024); }
  fit();
  if (window.ResizeObserver) new ResizeObserver(fit).observe(root); else window.addEventListener('resize', fit);

  /* Parpadeo a intervalos irregulares: normal, doble ocasional y alguno lento. */
  var eyes = root.querySelector('.eyes');
  if (!eyes || !eyes.animate) return;
  function blink(ms, depth) {
    eyes.animate(
      [{ transform: 'scaleY(1)' }, { transform: 'scaleY(' + depth + ')', offset: 0.45 }, { transform: 'scaleY(1)' }],
      { duration: ms, easing: 'ease-in-out' }
    );
  }
  function next() {
    setTimeout(function () {
      if (!document.hidden && !reduce.matches) {
        var r = Math.random();
        if (r < 0.12)      blink(340, 0.05);                                                            // lento
        else if (r < 0.30) { blink(180, 0.07); setTimeout(function () { blink(180, 0.07); }, 290); }   // doble
        else               blink(190 + Math.random() * 30, 0.07);
      }
      next();
    }, 2000 + Math.random() * 3600);
  }
  setTimeout(next, 1200);
})();
</script>
